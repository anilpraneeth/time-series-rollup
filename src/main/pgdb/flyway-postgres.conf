# Run from repository root, targeting the database hosting pg_cron.
# Supply FLYWAY_URL, FLYWAY_USER, FLYWAY_PASSWORD; review historical jobs first.
flyway.locations=filesystem:src/main/pgdb/migrations/postgres
flyway.schemas=public
flyway.table=schema_version_postgres
flyway.baselineOnMigrate=false
flyway.validateOnMigrate=true
flyway.cleanDisabled=true
